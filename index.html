<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start · Trond Erik</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563eb'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='700' font-size='30' fill='white' text-anchor='middle'%3ETE%3C/text%3E%3C/svg%3E">
<script>
  // Apply saved theme before paint to avoid flashing
  (function(){try{var t=localStorage.getItem('startside-tema');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
<style>
  :root{
    --bg:#f4f6fb; --bg2:#e9eef8;
    --surface:#ffffff; --surface-hover:#ffffff;
    --border:rgba(15,23,42,.08); --border-strong:rgba(15,23,42,.14);
    --text:#0f172a; --muted:#64748b; --faint:#94a3b8;
    --accent:#2563eb; --accent-soft:rgba(37,99,235,.10);
    --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 14px rgba(15,23,42,.05);
    --shadow-hover:0 2px 4px rgba(15,23,42,.05),0 14px 32px rgba(15,23,42,.10);
    --icon-bg:#f1f5f9;
    --glow1:rgba(59,130,246,.16); --glow2:rgba(16,185,129,.10);
  }
  :root[data-theme="dark"]{
    --bg:#0b1020; --bg2:#0e1428;
    --surface:#141b2e; --surface-hover:#18213a;
    --border:rgba(148,163,184,.10); --border-strong:rgba(148,163,184,.20);
    --text:#e6eaf3; --muted:#94a3b8; --faint:#64748b;
    --accent:#60a5fa; --accent-soft:rgba(96,165,250,.14);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.2);
    --shadow-hover:0 2px 4px rgba(0,0,0,.35),0 16px 36px rgba(0,0,0,.40);
    --icon-bg:#1e2740;
    --glow1:rgba(59,130,246,.18); --glow2:rgba(139,92,246,.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1020; --bg2:#0e1428;
      --surface:#141b2e; --surface-hover:#18213a;
      --border:rgba(148,163,184,.10); --border-strong:rgba(148,163,184,.20);
      --text:#e6eaf3; --muted:#94a3b8; --faint:#64748b;
      --accent:#60a5fa; --accent-soft:rgba(96,165,250,.14);
      --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.2);
      --shadow-hover:0 2px 4px rgba(0,0,0,.35),0 16px 36px rgba(0,0,0,.40);
      --icon-bg:#1e2740;
      --glow1:rgba(59,130,246,.18); --glow2:rgba(139,92,246,.12);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--text); background:var(--bg);
    background-image:
      radial-gradient(900px 500px at 8% -10%,var(--glow1),transparent 60%),
      radial-gradient(800px 500px at 100% 0%,var(--glow2),transparent 60%);
    background-attachment:fixed;
    min-height:100vh; -webkit-font-smoothing:antialiased;
    transition:background-color .25s,color .25s;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:36px 28px 56px}

  /* Header */
  header{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;margin-bottom:28px}
  .greeting{font-size:15px;font-weight:500;color:var(--muted);margin:0 0 4px;letter-spacing:.01em}
  .clock{font-size:56px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;margin:0}
  .clock .sec{font-size:22px;font-weight:500;color:var(--faint);margin-left:6px;letter-spacing:0}
  .date{margin-top:8px;font-size:16px;color:var(--muted);font-weight:500}
  .date::first-letter{text-transform:uppercase}

  .right{display:flex;align-items:center;gap:12px}
  .weather{
    display:flex;align-items:center;gap:14px;padding:12px 18px 12px 14px;
    background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);
    text-decoration:none;color:inherit;min-width:230px;transition:transform .15s,box-shadow .15s;
  }
  .weather:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
  .weather svg{width:46px;height:46px;flex:none}
  .w-temp{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .w-desc{font-size:13px;color:var(--muted);margin-top:4px;font-weight:500}
  .w-meta{font-size:12px;color:var(--faint);margin-top:2px}
  .theme-btn{
    width:44px;height:44px;border-radius:14px;border:1px solid var(--border);background:var(--surface);
    color:var(--text);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s;
  }
  .theme-btn:hover{transform:translateY(-1px)}
  .theme-btn svg{width:20px;height:20px}
  .theme-btn .moon{display:none}
  :root[data-theme="dark"] .theme-btn .sun{display:none}
  :root[data-theme="dark"] .theme-btn .moon{display:block}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .theme-btn .sun{display:none}
    :root:not([data-theme="light"]) .theme-btn .moon{display:block}
  }

  /* Search */
  .search{position:relative;margin:0 0 36px}
  .search input{
    width:100%;height:58px;border-radius:18px;border:1px solid var(--border-strong);
    background:var(--surface);color:var(--text);font:inherit;font-size:17px;
    padding:0 120px 0 54px;outline:none;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s;
  }
  .search input::placeholder{color:var(--faint)}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow)}
  .search .mag{position:absolute;left:19px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--faint);pointer-events:none}
  .search button{
    position:absolute;right:8px;top:8px;height:42px;padding:0 20px;border:0;border-radius:12px;
    background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:14px;cursor:pointer;
  }
  :root[data-theme="dark"] .search button{color:#0b1020}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .search button{color:#0b1020}}

  /* Sections */
  main{display:grid;grid-template-columns:repeat(12,1fr);gap:22px}
  section{grid-column:span 12}
  section.half{grid-column:span 6}
  section.third{grid-column:span 4}
  h2{
    display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;text-transform:uppercase;
    letter-spacing:.12em;color:var(--muted);margin:0 0 12px 2px;
  }
  h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent))}
  h2 .line{flex:1;height:1px;background:var(--border)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .card{
    position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:64px;
    background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);
    text-decoration:none;color:inherit;transition:transform .15s ease,box-shadow .15s ease,border-color .15s,background .15s;
    overflow:hidden;
  }
  .card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--c,var(--accent));opacity:0;transition:opacity .15s}
  .card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:var(--border-strong);background:var(--surface-hover);outline:none}
  .card:hover::before,.card:focus-visible::before{opacity:1}
  .ico{width:38px;height:38px;flex:none;border-radius:11px;background:var(--icon-bg);display:grid;place-items:center;overflow:hidden}
  .ico img{width:24px;height:24px;border-radius:5px}
  .ico .fb{font-weight:700;font-size:15px;color:var(--muted)}
  .txt{min-width:0}
  .name{font-weight:600;font-size:14.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
  .dom{font-size:12px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}


  /* Aksjer */
  .stocks{display:grid;gap:12px}
  .stocks.oslo{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stocks.usa{grid-template-columns:repeat(5,minmax(0,1fr))}
  .sgroup + .sgroup{margin-top:16px}
  .sgt{font-size:12.5px;font-weight:600;color:var(--text);margin:0 0 8px 2px;display:flex;align-items:center;gap:8px}
  .sgt::after{content:"";flex:1;height:1px;background:var(--border)}
  .stats{padding:4px 14px 12px;font-size:12px;display:flex;flex-direction:column;gap:9px}
  .stats .day{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 8px;font-size:11px;color:var(--muted);font-weight:600;padding-top:8px;border-top:1px solid var(--border)}
  .stats .when{white-space:nowrap}
  .stats .sess{flex:none;display:inline-flex;align-items:center;gap:5px;font-weight:500;color:var(--faint)}
  .stats .sess::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;display:none}
  .stats .sess.open{color:#16a34a}.stats .sess.pre{color:#d97706}.stats .sess.closed{color:var(--faint)}
  .stats .sess:not(:empty)::before{display:inline-block}
  .stats .chg{font-variant-numeric:tabular-nums;margin-left:4px}
  .stats .chg.up{color:#16a34a}.stats .chg.down{color:#dc2626}
  .stats .k{color:var(--faint);font-size:11px}
  .stats .v{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .stats .grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px}
  .stats .st{display:flex;flex-direction:column;gap:1px;min-width:0}
  .stats .st .v{overflow:hidden;text-overflow:ellipsis}
  .stats .rl{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:5px}
  .stats .bar{position:relative;height:4px;border-radius:4px;background:var(--icon-bg)}
  .stats .bar i{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 0 2px var(--surface);opacity:0;transition:left .4s ease,opacity .3s}
  .stock{
    display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:16px;
    box-shadow:var(--shadow);overflow:hidden;transition:transform .15s ease,box-shadow .15s ease,border-color .15s;
  }
  .stock:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:var(--border-strong)}
  .stock .tv{height:150px;position:relative;color-scheme:light;overflow:hidden}
  .stock .tv .layer{position:absolute;inset:10px 6px 0 8px;transition:opacity .35s ease}
  .stock .tv .layer.pending{opacity:0;pointer-events:none}
  h2 .upd{font-size:11px;font-weight:500;letter-spacing:.02em;text-transform:none;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
  .stock .tv .tradingview-widget-container,.stock .tv .tradingview-widget-container__widget{height:100%;width:100%}
  .stock .tv .loading{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--faint)}
  .stock .foot{
    display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px;
    border-top:1px solid var(--border);font-size:12px;color:var(--muted);text-decoration:none;
  }
  .stock .foot:hover{color:var(--accent)}
  .stock .meta{display:flex;flex-direction:column;min-width:0}
  .stock .who{font-weight:600;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stock .sub{font-size:11.5px;color:var(--faint);margin-top:1px}
  .stock .arrow{flex:none;width:26px;height:26px;border-radius:8px;background:var(--icon-bg);display:grid;place-items:center;font-size:13px;color:var(--muted);transition:background .15s,color .15s}
  .stock .foot:hover .arrow{background:var(--accent-soft);color:var(--accent)}
  .stocks-note{font-size:11.5px;color:var(--faint);margin:8px 2px 0}
  .stocks-note a{color:inherit}

  footer{margin-top:40px;text-align:center;font-size:12px;color:var(--faint)}
  footer a{color:inherit}

  @media (max-width:1100px){ .stocks.usa{grid-template-columns:repeat(3,minmax(0,1fr))} }
  @media (max-width:980px){
    section.half,section.third{grid-column:span 12}
  }
  @media (max-width:720px){
    .wrap{padding:22px 16px 40px}
    header{grid-template-columns:1fr;gap:16px;margin-bottom:20px}
    .clock{font-size:44px}
    .right{justify-content:space-between}
    .weather{flex:1;min-width:0}
    .search{margin-bottom:26px}
    .search input{height:52px;font-size:16px;padding-right:20px}
    .search button{display:none}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .card{padding:10px 11px;gap:10px;min-height:60px}
    .name{font-size:14px}
    .ico{width:34px;height:34px}
    .ico img{width:22px;height:22px}
    main{gap:20px}
    .stocks.oslo,.stocks.usa{grid-template-columns:1fr;gap:10px}
    .stock .tv{height:168px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="greeting" id="greeting">Hei, Trond Erik</p>
      <h1 class="clock" id="clock">--:--<span class="sec">--</span></h1>
      <div class="date" id="date"></div>
    </div>
    <div class="right">
      <a class="weather" id="weather" href="https://www.yr.no/nb/v%C3%A6rvarsel/daglig-tabell/1-23221/Norge/Vestfold%20og%20Telemark/Larvik/Stavern" target="_blank" rel="noopener noreferrer" title="Været i Stavern på Yr">
        <span id="w-icon"></span>
        <div>
          <div class="w-temp" id="w-temp">–°</div>
          <div class="w-desc" id="w-desc">Henter vær …</div>
          <div class="w-meta" id="w-meta">Stavern</div>
        </div>
      </a>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Bytt mellom lyst og mørkt tema" title="Bytt tema">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <form class="search" action="https://www.google.com/search" method="get" target="_self" role="search">
    <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" name="q" id="q" placeholder="Søk med Google …" autocomplete="off" aria-label="Søk med Google" autofocus>
    <button type="submit">Søk</button>
  </form>

  <main id="sections"></main>

  <footer>Startside for Trond Erik · Vær fra <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a></footer>
</div>

<script>
const SECTIONS = [
  { title:"Nyheter", color:"#ef4444", links:[
    ["NRK","https://www.nrk.no/"],
    ["VG","https://vg.no"],
    ["Dagbladet","https://www.dagbladet.no","dagbladet.no"],
    ["Nettavisen","https://www.nettavisen.no"],
    ["Aftenposten","https://www.aftenposten.no/"],
    ["TV 2","https://www.tv2.no/"],
    ["ABC Nyheter","https://www.abcnyheter.no/"],
    ["Dagsavisen","https://www.dagsavisen.no/"],
    ["Klassekampen","https://klassekampen.no/"],
    ["Morgenbladet","https://www.morgenbladet.no/"],
  ]},
  { title:"Lokalt", color:"#10b981", cls:"half", links:[
    ["Østlandsposten","http://www.op.no/","op.no"],
    ["Tønsbergs Blad","https://www.tb.no/"],
    ["Sandefjords Blad","https://www.sb.no/"],
    ["Varden","https://www.varden.no/"],
  ]},
  { title:"Regionalt", color:"#06b6d4", cls:"half", links:[
    ["Bergens Tidende","https://www.bt.no/"],
    ["Stavanger Aftenblad","https://www.aftenbladet.no/"],
    ["Adresseavisen","https://www.adressa.no/"],
  ]},
  { title:"Økonomi", color:"#f59e0b", cls:"half", links:[
    ["E24","http://www.e24.no/","e24.no"],
    ["Dagens Næringsliv","https://www.dn.no/"],
    ["Finansavisen","https://www.finansavisen.no/"],
    ["TSLA","https://www.msn.com/en-gb/money/watchlist?id=a24kar&noti=InstitutionalHolding&ownr=1&ocid=msedgntp&duration=1D","msn.com"],
  ]},
  { title:"Bank og investering", color:"#22c55e", cls:"half", links:[
    ["DNB","https://www.dnb.no"],
    ["Nordnet","https://nordnet.no"],
  ]},
  { title:"Hjem og vær", color:"#3b82f6", cls:"half", links:[
    ["Været i Stavern","https://www.yr.no/nb/v%C3%A6rvarsel/daglig-tabell/1-23221/Norge/Vestfold%20og%20Telemark/Larvik/Stavern","yr.no"],
    ["HWGT27 Netatmo","https://my.netatmo.com/app/station","netatmo.com"],
    ["KDA anywhere","https://kdaoffice.kongsberg.com/vpn/index.html","kongsberg.com"],
    ["KM citrix","https://citrix.km.kongsberg.com/vpn/index.html","kongsberg.com"],
  ]},
  { title:"Sosialt", color:"#64748b", cls:"half", links:[
    ["X","https://twitter.com/","x.com"],
  ]},
  { title:"Motorsykler", color:"#a855f7", links:[
    ["Yamaha Ténéré 700","https://sites.google.com/view/hwgt27/yamaha-tenere-700","sites.google.com"],
    ["KTM Duke II LC4 2007","https://sites.google.com/view/hwgt27/ktm-duke-ii-lc4-2007","sites.google.com"],
    ["Honda VT 600","https://sites.google.com/view/hwgt27/honda-vt-600","sites.google.com"],
    ["Suzuki GSX-R750","https://sites.google.com/view/hwgt27/suzuki-gsxr750","sites.google.com"],
    ["Gamle startside","https://sites.google.com/view/hwgt27/home","sites.google.com"],
  ]},
];

function domainOf(url){ try{ return new URL(url).hostname.replace(/^www\./,''); }catch(e){ return url; } }
function esc(s){ return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

const main = document.getElementById('sections');
for (const s of SECTIONS){
  const sec = document.createElement('section');
  if (s.cls) sec.className = s.cls;
  sec.style.setProperty('--c', s.color);
  let html = `<h2><span class="dot"></span>${esc(s.title)}<span class="line"></span></h2><div class="grid">`;
  for (const [name,url,shown] of s.links){
    const d = shown || domainOf(url);
    html += `<a class="card" href="${esc(url)}" target="_blank" rel="noopener noreferrer" title="${esc(name)} – ${esc(d)}">
      <span class="ico"><img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(d)}&sz=64" alt="" loading="lazy"
        onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fb',textContent:'${esc(name[0])}'}))"></span>
      <span class="txt"><div class="name">${esc(name)}</div><div class="dom">${esc(d)}</div></span></a>`;
  }
  sec.innerHTML = html + '</div>';
  main.appendChild(sec);
}


/* Aksjer – TradingView mini symbol overview widgets (gratis, ingen nøkkel) + nøkkeltall fra TradingViews åpne scanner-API */
const STOCK_GROUPS = [
  { title:"Oslo Børs", cls:"oslo", tz:"Europe/Oslo", stocks:[
    { name:"Kongsberg Gruppen",  tv:"OSL:KOG",  ex:"Oslo Børs", cur:"NOK" },
    { name:"Kongsberg Maritime", tv:"OSL:KMAR", ex:"Oslo Børs", cur:"NOK" },
    { name:"Hunter Group",       tv:"OSL:HUNT", ex:"Oslo Børs", cur:"NOK" },
  ]},
  { title:"USA", cls:"usa", tz:"America/New_York", stocks:[
    { name:"Tesla",             tv:"NASDAQ:TSLA",  ex:"Nasdaq", cur:"USD" },
    { name:"SpaceX",            tv:"NASDAQ:SPCX",  ex:"Nasdaq", cur:"USD" },
    { name:"NVIDIA",            tv:"NASDAQ:NVDA",  ex:"Nasdaq", cur:"USD" },
    { name:"Alphabet (Google)", tv:"NASDAQ:GOOGL", ex:"Nasdaq", cur:"USD" },
    { name:"Apple",             tv:"NASDAQ:AAPL",  ex:"Nasdaq", cur:"USD" },
  ]},
];
const STOCKS = STOCK_GROUPS.flatMap(g => g.stocks.map(st => ({...st, tz:g.tz})));
function effectiveTheme(){ return document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
function statsSkeleton(){
  const cell = (k,l) => `<div class="st"><span class="k">${l}</span><span class="v" data-f="${k}">–</span></div>`;
  return `<div class="stats" aria-live="off">
    <div class="day"><span class="when"><span data-f="when">Henter nøkkeltall …</span> <span class="chg" data-f="chg"></span></span><span class="sess" data-f="sess"></span></div>
    <div class="range"><div class="rl"><span class="k">Dagens spenn</span><span class="v" data-f="dayr">–</span></div><div class="bar"><i data-f="dayp"></i></div></div>
    <div class="grid2">${cell('open','Åpning')}${cell('prev','Forrige slutt')}${cell('vol','Volum')}${cell('cap','Markedsverdi')}</div>
    <div class="range"><div class="rl"><span class="k">52 uker</span><span class="v" data-f="wkr">–</span></div><div class="bar"><i data-f="wkp"></i></div></div>
  </div>`;
}
function buildStocksSection(){
  const sec = document.createElement('section');
  sec.id = 'aksjer';
  sec.style.setProperty('--c', '#14b8a6');
  let h = `<h2><span class="dot"></span>Aksjer<span class="line"></span><time class="upd" id="stocksUpdated" aria-live="polite">Henter kurser …</time></h2>`;
  for (const g of STOCK_GROUPS){
    h += `<div class="sgroup"><h3 class="sgt">${esc(g.title)}</h3><div class="stocks ${g.cls}">`;
    for (const st of g.stocks){
      const url = `https://www.tradingview.com/symbols/${st.tv.replace(':','-')}/`;
      h += `<div class="stock" data-sym="${st.tv}"><div class="tv" data-symbol="${st.tv}"><div class="loading">Henter kurs …</div></div>
        ${statsSkeleton()}
        <a class="foot" href="${url}" target="_blank" rel="noopener noreferrer" title="Se ${esc(st.name)} på TradingView">
          <span class="meta"><span class="who">${esc(st.name)}</span><span class="sub">${st.ex} · ${st.cur}</span></span>
          <span class="arrow" aria-hidden="true">↗</span></a></div>`;
    }
    h += `</div></div>`;
  }
  h += `<p class="stocks-note">Kurser, intradaggraf (i dag eller siste handelsdag) og nøkkeltall fra <a href="https://www.tradingview.com/" target="_blank" rel="noopener noreferrer">TradingView</a>. Kursene er ca. 15 minutter forsinket (gjelder både Nasdaq og Oslo Børs i gratis-widgetene); siden henter dem på nytt hvert minutt.</p>`;
  sec.innerHTML = h;
  return sec;
}
/* Nøkkeltall: én samlet forespørsel for alle aksjene */
const STAT_COLS = ["open","high","low","close","change_abs","change","volume","price_52_week_high","price_52_week_low","total_shares_outstanding_current","time","current_session","currency"];
const nbNum = (v,d=2) => v==null||!isFinite(v) ? '–' : v.toLocaleString('nb-NO',{minimumFractionDigits:d,maximumFractionDigits:d});
const nbCompact = v => v==null||!isFinite(v) ? '–' : v < 1e6 ? Math.round(v).toLocaleString('nb-NO') : new Intl.NumberFormat('nb-NO',{notation:'compact',maximumFractionDigits:v>=1e12?2:1}).format(v);
const pct = (x,lo,hi) => (hi>lo && x!=null) ? Math.max(0,Math.min(100,(x-lo)/(hi-lo)*100)) : null;
const SESS = { market:['Åpen','open'], pre_market:['Før åpning','pre'], post_market:['Etterhandel','pre'], out_of_session:['Stengt','closed'] };
let statsLoadedOnce = false;
async function loadStockStats(){
  try{
    const r = await fetch('https://scanner.tradingview.com/global/scan', { method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ symbols:{ tickers: STOCKS.map(s=>s.tv) }, columns: STAT_COLS }) });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    for (const row of j.data || []){
      const st = STOCKS.find(s=>s.tv===row.s); if (!st) continue;
      const d = Object.fromEntries(STAT_COLS.map((c,i)=>[c,row.d[i]]));
      const card = document.querySelector(`#aksjer .stock[data-sym="${row.s}"]`); if (!card) continue;
      const set = (f,v) => { const el = card.querySelector(`[data-f="${f}"]`); if (el) el.textContent = v; };
      const bar = (f,p) => { const el = card.querySelector(`[data-f="${f}"]`); if (el){ el.style.left = p==null ? '50%' : p+'%'; el.style.opacity = p==null ? 0 : 1; } };
      const cur = d.currency || st.cur;
      // Er dagslinjen fra i dag (i børsens tidssone) eller fra siste handelsdag?
      const dfmt = new Intl.DateTimeFormat('nb-NO',{timeZone:st.tz,year:'numeric',month:'2-digit',day:'2-digit'});
      const barDay = d.time ? dfmt.format(new Date(d.time*1000)) : null;
      const today = dfmt.format(new Date());
      const isToday = barDay && barDay === today;
      const dayLabel = d.time ? new Intl.DateTimeFormat('nb-NO',{timeZone:st.tz,weekday:'short',day:'numeric',month:'short'}).format(new Date(d.time*1000)) : '';
      set('when', isToday ? 'I dag' : `Siste handelsdag · ${dayLabel}`);
      const chEl = card.querySelector('[data-f="chg"]');
      if (d.change!=null){
        const sign = d.change>0 ? '+' : d.change<0 ? '−' : '';
        chEl.textContent = `${sign}${nbNum(Math.abs(d.change))} % (${sign}${nbNum(Math.abs(d.change_abs))})`;
        chEl.className = 'chg ' + (d.change>0 ? 'up' : d.change<0 ? 'down' : '');
      }
      const [sl,sc] = SESS[d.current_session] || ['',''];
      const sEl = card.querySelector('[data-f="sess"]'); sEl.textContent = sl; sEl.className = 'sess ' + sc;
      set('dayr', `${nbNum(d.low)} – ${nbNum(d.high)}`); bar('dayp', pct(d.close,d.low,d.high));
      set('wkr', `${nbNum(d.price_52_week_low)} – ${nbNum(d.price_52_week_high)}`); bar('wkp', pct(d.close,d.price_52_week_low,d.price_52_week_high));
      set('open', nbNum(d.open));
      set('prev', (d.close!=null && d.change_abs!=null) ? nbNum(d.close - d.change_abs) : '–');
      set('vol', nbCompact(d.volume));
      const cap = (d.total_shares_outstanding_current && d.close) ? d.total_shares_outstanding_current * d.close : null;
      set('cap', cap ? `${nbCompact(cap)} ${cur}` : '–');
    }
    statsLoadedOnce = true;
    return true;
  }catch(e){
    if (!statsLoadedOnce) document.querySelectorAll('#aksjer [data-f="when"]').forEach(el=>el.textContent='Nøkkeltall utilgjengelig');
    return false;
  }
}
/* Kursene oppdateres hvert minutt: nye widgeter lastes skjult oppå de gamle og byttes inn først når de er klare. */
const STOCK_REFRESH_MS = 60 * 1000;
const STOCK_SWAP_DELAY_MS = 1500;     // tid etter iframe-load før bytte (lar widgeten tegne kurs og graf)
const STOCK_SWAP_TIMEOUT_MS = 12000;  // bytt uansett etter dette
let stocksTheme = null, stockTimer = null, stockGen = 0, lastStockRefresh = 0;
const fmtUpd = new Intl.DateTimeFormat('nb-NO',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Oslo'});
function makeWidget(sym, theme){
  const c = document.createElement('div'); c.className = 'tradingview-widget-container';
  const w = document.createElement('div'); w.className = 'tradingview-widget-container__widget'; c.appendChild(w);
  const sc = document.createElement('script');
  sc.src = 'https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js';
  sc.async = true;
  sc.textContent = JSON.stringify({ symbol:sym, width:"100%", height:"100%", locale:"no", dateRange:"1D",
    colorTheme:theme, isTransparent:true, autosize:true, largeChartUrl:"", chartOnly:false, noTimeScale:false });
  c.appendChild(sc);
  return c;
}
function refreshBox(box, theme, gen){
  return new Promise(resolve=>{
    const layer = document.createElement('div');
    layer.className = 'layer pending';
    layer.appendChild(makeWidget(box.dataset.symbol, theme));
    box.appendChild(layer);
    let done = false, poll = null;
    const swap = ()=>{
      if (done) return; done = true; clearInterval(poll);
      if (gen !== stockGen){ layer.remove(); return resolve(false); }   // en nyere oppdatering har tatt over
      layer.classList.remove('pending');
      box.querySelectorAll(':scope > .layer:not(.pending)').forEach(old=>{ if (old !== layer) setTimeout(()=>old.remove(), 400); });
      const l = box.querySelector('.loading'); if (l) l.remove();
      resolve(true);
    };
    poll = setInterval(()=>{
      const f = layer.querySelector('iframe');
      if (f && !f.dataset.watch){ f.dataset.watch = '1'; f.addEventListener('load', ()=>setTimeout(swap, STOCK_SWAP_DELAY_MS), {once:true}); }
    }, 100);
    setTimeout(swap, STOCK_SWAP_TIMEOUT_MS);
  });
}
async function refreshStocks(){
  const theme = effectiveTheme();
  stocksTheme = theme;
  const gen = ++stockGen;
  lastStockRefresh = Date.now();
  // fjern evt. halvferdige lag fra en tidligere runde
  document.querySelectorAll('#aksjer .tv > .layer.pending').forEach(l=>l.remove());
  const statsP = loadStockStats();
  const results = await Promise.all([...document.querySelectorAll('#aksjer .tv')].map(b=>refreshBox(b, theme, gen)));
  await statsP;
  if (gen === stockGen && results.some(Boolean)){
    const el = document.getElementById('stocksUpdated');
    el.textContent = `Oppdatert ${fmtUpd.format(new Date()).replace('.',':')}`;
    el.dateTime = new Date().toISOString();
  }
}
function scheduleStocks(){
  clearInterval(stockTimer);
  stockTimer = setInterval(()=>{ if (!document.hidden) refreshStocks(); }, STOCK_REFRESH_MS);
}
function renderStockWidgets(){            // brukes ved temabytte
  if (effectiveTheme() === stocksTheme) return;
  refreshStocks(); scheduleStocks();
}
{
  const stocksSec = buildStocksSection();
  main.prepend(stocksSec);
  refreshStocks(); scheduleStocks();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderStockWidgets);
  document.addEventListener('visibilitychange', ()=>{
    if (document.hidden){ clearInterval(stockTimer); stockTimer = null; }
    else { refreshStocks(); scheduleStocks(); }
  });
}

/* Clock, date, greeting */
const fmtTime = new Intl.DateTimeFormat('nb-NO',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Oslo'});
const fmtSec  = new Intl.DateTimeFormat('nb-NO',{second:'2-digit',timeZone:'Europe/Oslo'});
const fmtDate = new Intl.DateTimeFormat('nb-NO',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Europe/Oslo'});
const fmtHour = new Intl.DateTimeFormat('nb-NO',{hour:'numeric',hourCycle:'h23',timeZone:'Europe/Oslo'});
function weekNo(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y=new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y)/864e5+1)/7); }
function tick(){
  const now = new Date();
  const h = parseInt(fmtHour.format(now),10);
  const greet = h>=5&&h<10 ? 'God morgen' : h>=10&&h<12 ? 'God formiddag' : h>=12&&h<18 ? 'God ettermiddag' : h>=18&&h<23 ? 'God kveld' : 'God natt';
  document.getElementById('greeting').textContent = `${greet}, Trond Erik`;
  document.getElementById('clock').innerHTML = `${fmtTime.format(now).replace('.',':')}<span class="sec">${fmtSec.format(now).padStart(2,'0')}</span>`;
  document.getElementById('date').textContent = `${fmtDate.format(now)} · uke ${weekNo(now)}`;
}
tick(); setInterval(tick, 1000);

/* Theme toggle */
const root = document.documentElement;
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const cur = root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  root.dataset.theme = next;
  try{ localStorage.setItem('startside-tema', next); }catch(e){}
  renderStockWidgets();
});

/* Weather (Open-Meteo, no key) */
const WMO = {
  0:['Klarvær','clear'],1:['Lettskyet','partly'],2:['Delvis skyet','partly'],3:['Overskyet','cloud'],
  45:['Tåke','fog'],48:['Rimtåke','fog'],
  51:['Lett yr','drizzle'],53:['Yr','drizzle'],55:['Kraftig yr','drizzle'],56:['Underkjølt yr','drizzle'],57:['Underkjølt yr','drizzle'],
  61:['Lett regn','rain'],63:['Regn','rain'],65:['Kraftig regn','rain'],66:['Underkjølt regn','rain'],67:['Underkjølt regn','rain'],
  71:['Lett snø','snow'],73:['Snø','snow'],75:['Kraftig snø','snow'],77:['Snøkorn','snow'],
  80:['Regnbyger','rain'],81:['Regnbyger','rain'],82:['Kraftige regnbyger','rain'],
  85:['Snøbyger','snow'],86:['Kraftige snøbyger','snow'],
  95:['Tordenvær','thunder'],96:['Torden med hagl','thunder'],99:['Torden med hagl','thunder'],
};
function icon(kind, day){
  const sun = `<circle cx="24" cy="24" r="8" fill="#fbbf24"/><g stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"><path d="M24 7v4M24 37v4M7 24h4M37 24h4M12 12l2.8 2.8M33.2 33.2 36 36M12 36l2.8-2.8M33.2 14.8 36 12"/></g>`;
  const moon = `<path d="M30 9a13 13 0 1 0 9 22A11 11 0 0 1 30 9z" fill="#c7d2fe"/>`;
  const cloud = (x=0,y=0,c='#cbd5e1') => `<path transform="translate(${x} ${y})" d="M15 38h20a8 8 0 0 0 .8-16A11 11 0 0 0 14.6 25 6.5 6.5 0 0 0 15 38z" fill="${c}"/>`;
  const small = (inner) => `<g transform="translate(-4 -6) scale(.75)">${inner}</g>`;
  const drops = (c) => `<g stroke="${c}" stroke-width="2.5" stroke-linecap="round"><path d="M18 41l-2 4M25 41l-2 4M32 41l-2 4"/></g>`;
  let b='';
  switch(kind){
    case 'clear': b = day ? sun : moon; break;
    case 'partly': b = small(day?sun:moon) + cloud(2,0); break;
    case 'cloud': b = cloud(-3,-6,'#94a3b8') + cloud(3,0); break;
    case 'fog': b = cloud(0,-6) + `<g stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"><path d="M10 38h28M14 44h22"/></g>`; break;
    case 'drizzle': b = cloud(0,-6) + `<g fill="#60a5fa"><circle cx="18" cy="40" r="1.6"/><circle cx="25" cy="43" r="1.6"/><circle cx="32" cy="40" r="1.6"/></g>`; break;
    case 'rain': b = cloud(0,-6) + drops('#3b82f6'); break;
    case 'snow': b = cloud(0,-6) + `<g fill="#93c5fd"><circle cx="17" cy="41" r="2"/><circle cx="25" cy="44" r="2"/><circle cx="33" cy="41" r="2"/></g>`; break;
    case 'thunder': b = cloud(0,-6,'#94a3b8') + `<path d="M26 32l-6 9h5l-3 7 8-10h-5l3-6z" fill="#fbbf24"/>`; break;
  }
  return `<svg viewBox="0 0 48 48" aria-hidden="true">${b}</svg>`;
}
async function loadWeather(attempt=1){
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=59.00&longitude=10.03&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day&daily=temperature_2m_max,temperature_2m_min&wind_speed_unit=ms&timezone=Europe%2FOslo&forecast_days=1';
  try{
    const r = await fetch(url); if(!r.ok) throw new Error(r.status);
    const j = await r.json(); const c = j.current;
    const [desc,kind] = WMO[c.weather_code] || ['Ukjent','cloud'];
    const n = v => Math.round(v).toString().replace('-','−');
    document.getElementById('w-icon').innerHTML = icon(kind, c.is_day===1);
    document.getElementById('w-temp').textContent = `${n(c.temperature_2m)}°`;
    document.getElementById('w-desc').textContent = `${desc} · føles som ${n(c.apparent_temperature)}°`;
    const wind = c.wind_speed_10m.toLocaleString('nb-NO',{maximumFractionDigits:0});
    document.getElementById('w-meta').textContent = `Stavern · ${n(j.daily.temperature_2m_min[0])}°/${n(j.daily.temperature_2m_max[0])}° · ${wind} m/s`;
  }catch(e){
    if (attempt < 3){ setTimeout(()=>loadWeather(attempt+1), 4000*attempt); return; }
    document.getElementById('w-icon').innerHTML = icon('cloud', true);
    document.getElementById('w-desc').textContent = 'Vær utilgjengelig';
  }
}
loadWeather(); setInterval(()=>loadWeather(), 15*60*1000);
